name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out code
      - uses: actions/checkout@v7

      - name: Set up node
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies  
      - run: npm ci

      - name: Npx tsc
      - run: npx tsc --noEmit

      - name: Run tests
      - run: npm test

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:

      - name: Check out code 
      - uses: actions/checkout@v7

      - name: Set up Node
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies    
      - run: npm ci

      - name: Run linting 
      - run: npm run lint

      - name: Build 
      - run: npm run build

  shared:
    name: Shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:

      - name: Check out code 
      - uses: actions/checkout@v7

      - name: Set up Node 
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared/package-lock.json
      
      - name: Install dependencies
      - run: npm ci

      - name: Run checks
      - run: npm run check
